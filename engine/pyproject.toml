[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epiphysics-observatory"
version = "0.1.0"
description = "A local, auditable ledger for prospective representation experiments"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
epiphysics = "epiphysics.cli:main"

[tool.setuptools.packages.find]
include = ["epiphysics*"]
