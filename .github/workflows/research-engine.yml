name: Research engine
on:
  push:
    paths: ['engine/**', '.github/workflows/research-engine.yml']
  pull_request:
    paths: ['engine/**', '.github/workflows/research-engine.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: engine
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run engine tests
        run: python -m unittest discover -s engine/tests -v
      - name: Verify synthetic controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from epiphysics.representation_checks import evaluate, reference_candidate, degraded_candidate

          suite = json.loads(Path('engine/examples/improvement/entities.json').read_text())
          reference = evaluate(suite, reference_candidate(suite))['metrics']
          degraded = evaluate(suite, degraded_candidate(suite))['metrics']
          assert reference['checks'] == reference['correct'] == reference['answered'] == 30
          assert reference['provenance_correct'] == 30
          assert reference['macro_family_accuracy'] == reference['worst_family_accuracy'] == 1
          assert reference['temporal_violations'] == degraded['temporal_violations'] == 0
          assert degraded['correct'] == 18 and degraded['answered'] == 30
          assert degraded['provenance_correct'] == 23 and degraded['worst_family_accuracy'] == 0.5
          print('Synthetic oracle and degraded controls matched their declared results.')
          PY
      - name: Verify source-span and assertion-history capabilities
        run: |
          python - <<'PY'
          from epiphysics.source_span_checks import run_source_span_checks

          report = run_source_span_checks()
          assert report['version'] == 'source-span-probes-v1'
          assert len(report['checks']) == 14 and report['all_passed'] is True
          assert report['counts']['source_span_resolution'] == {'passed': 8, 'checks': 8}
          assert report['counts']['assertion_history_preservation'] == {'passed': 6, 'checks': 6}
          assert report['metrics']['source_span_resolution'] == 1
          assert report['metrics']['assertion_history_preservation'] == 1
          print('Actual assertion API passed all 14 synthetic capability contracts.')
          PY
      - name: Verify representation manifest capabilities
        run: |
          python - <<'PY'
          from epiphysics.manifest_checks import run_manifest_checks

          report = run_manifest_checks()
          assert report['version'] == 'representation-manifest-probes-v2'
          assert len(report['checks']) == 22 and report['all_passed'] is True
          assert report['counts']['representation_manifest_preservation'] == {'passed': 22, 'checks': 22}
          assert report['metrics']['representation_manifest_preservation'] == 1
          print('Actual manifest API passed all 22 synthetic metadata and forecast-binding contracts.')
          PY
      - name: Verify executed graph transformation capabilities
        run: |
          python - <<'PY'
          from epiphysics.transformation_checks import run_transformation_checks

          report = run_transformation_checks()
          assert report['version'] == 'graph-transformation-probes-v2'
          assert len(report['checks']) == 26 and report['all_passed'] is True
          assert report['counts']['transformation_preservation'] == {'passed': 26, 'checks': 26}
          assert report['metrics']['transformation_preservation'] == 1
          print('Actual fixed graph operations passed all 26 synthetic transformation contracts.')
          PY
      - name: Verify executed graph partition and merge capabilities
        run: |
          python - <<'PY'
          from epiphysics.graph_view_checks import run_graph_view_checks

          report = run_graph_view_checks()
          assert report['version'] == 'graph-view-probes-v1'
          assert len(report['checks']) == 45 and report['all_passed'] is True
          assert report['counts']['split_merge_preservation'] == {'passed': 45, 'checks': 45}
          assert report['metrics']['split_merge_preservation'] == 1
          print('Actual fixed graph views passed all 45 synthetic partition/merge contracts.')
          PY
      - name: Dispatch and inspect a real offline worker
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          with tempfile.TemporaryDirectory(prefix='epiphysics-worker-', dir=os.environ['RUNNER_TEMP']) as temporary:
              store = (Path(temporary) / 'dedicated-store').resolve()
              command = [sys.executable, '-m', 'epiphysics.improvement', '--store', str(store)]
              child = subprocess.run(command + [
                  'dispatch', '--policy', 'engine/examples/improvement/policy.json',
                  '--suite', 'engine/examples/improvement/entities.json', '--candidate', 'reference',
                  '--run-key', 'smoke', '--after-step', 'initial', '--timeout-seconds', '30',
                  '--completed-work', 'Ran the synthetic oracle through a real assessment worker',
              ], check=True, capture_output=True, text=True, timeout=45)
              result = json.loads(child.stdout)
              assert result['result'] == 'assessed'
              receipt = result['dispatch']
              assert receipt['program'] == 'epiphysics.improvement assess'
              assert isinstance(receipt['pid'], int) and receipt['pid'] > 0
              assert receipt['returncode'] == 0 and receipt['termination'] is None
              assert receipt['model_calls'] == receipt['external_spend'] == 0
              assert result['assessment']['report']['metrics']['correct'] == 30
              capability = result['assessment']['report']['source_span_checks']
              assert capability['version'] == 'source-span-probes-v1' and capability['all_passed'] is True
              assert capability['counts']['source_span_resolution'] == {'passed': 8, 'checks': 8}
              assert capability['counts']['assertion_history_preservation'] == {'passed': 6, 'checks': 6}
              manifests = result['assessment']['report']['manifest_checks']
              assert manifests['version'] == 'representation-manifest-probes-v2' and manifests['all_passed'] is True
              assert manifests['counts']['representation_manifest_preservation'] == {'passed': 22, 'checks': 22}
              assert result['assessment']['report']['metrics']['representation_manifest_preservation'] == 1
              transforms = result['assessment']['report']['transformation_checks']
              assert transforms['version'] == 'graph-transformation-probes-v2' and transforms['all_passed'] is True
              assert transforms['counts']['transformation_preservation'] == {'passed': 26, 'checks': 26}
              assert result['assessment']['report']['metrics']['transformation_preservation'] == 1
              views = result['assessment']['report']['graph_view_checks']
              assert views['version'] == 'graph-view-probes-v1' and views['all_passed'] is True
              assert views['counts']['split_merge_preservation'] == {'passed': 45, 'checks': 45}
              assert result['assessment']['report']['metrics']['split_merge_preservation'] == 1
              assert {'assertions', 'source_span_probe', 'store', 'manifests', 'manifest_probe', 'transforms', 'transformation_probe', 'graph_views', 'graph_view_probe'} <= result['assessment']['request']['manifest'].keys()
              receipts = Path(receipt['receipt_directory'])
              assert receipts.parent == store / 'dispatches'
              assert all((receipts / name).is_file() for name in ('start.json', 'output.log', 'finish.json'))
              inspected = subprocess.run(command + ['status'], check=True, capture_output=True, text=True, timeout=15)
              status = json.loads(inspected.stdout)
              assert status['completed_assessments'] == 1 and status['unfinished_runs'] == []
              assert status['next_step']['id'] == 'smoke:next'
              assert status['next_step']['action'] == 'build_transform_materialization'
              assert status['next_step']['metric'] == 'output_manifest_materialization'
              assert status['next_step']['observed'] is None
              assert status['next_step']['scale_change_allowed'] is False
          print('Real offline worker completed; its verified successor remains queued.')
          PY
      - name: Run synthetic ledger demo
        run: python -m epiphysics --store "$RUNNER_TEMP/epiphysics-demo" demo
