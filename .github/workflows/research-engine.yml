name: Research engine
on:
  push:
    paths: ['engine/**', '.github/workflows/research-engine.yml']
  pull_request:
    paths: ['engine/**', '.github/workflows/research-engine.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: PYTHONPATH=engine python -m unittest discover -s engine/tests -v
      - run: PYTHONPATH=engine python -m epiphysics --store "$RUNNER_TEMP/epiphysics-demo" demo
